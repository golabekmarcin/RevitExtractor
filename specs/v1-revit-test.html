<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>RevitExtractor v1 live test</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--mute:#5b6570;--line:#d7dce2;--accent:#1f5fbf;--accent-ink:#fff;
--pass:#1a7f37;--fail:#c62828;--block:#b45309;--inc:#7b3fb5;--nt:#6b7280;--code:#0f172a;--codeink:#e6edf3;--warn:#fff4d6;--warnline:#e0b100}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--panel:#1d2127;--ink:#e6e9ee;--mute:#9aa4af;--line:#363c45;--accent:#6aa5ff;--accent-ink:#0b1220;
--pass:#4cc26b;--fail:#ff7b72;--block:#f0a04b;--inc:#c39bff;--nt:#8b949e;--code:#0b0e12;--codeink:#dbe4ee;--warn:#3a3012;--warnline:#8a6d00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0}
.bar{flex:1 1 220px;min-width:160px}
.bar .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar .track span{display:block;height:100%}
.bar small{color:var(--mute)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--fail);border-color:var(--fail)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
nav{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px;overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
nav h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:12px 6px 4px}
nav button{display:flex;gap:7px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:4px 6px;border-radius:5px}
nav button.cur{background:var(--accent);color:var(--accent-ink)}
nav .st{width:1.2em;text-align:center;font-weight:700}
main{padding:18px 22px 60px;max-width:980px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;max-height:260px;border-right:0;border-bottom:1px solid var(--line)}}
h2{margin:0 0 4px}h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:20px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0}
pre{background:var(--code);color:var(--codeink);border-radius:6px;padding:10px 12px;overflow:auto;margin:0;font:13px/1.45 Consolas,monospace;white-space:pre}
code{font:13px Consolas,monospace;background:rgba(127,127,127,.18);padding:0 4px;border-radius:3px}
.cmd{margin:10px 0}.cmd .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.cmd .lab{font-weight:600}.cmd .cwd{color:var(--mute);font-size:13px}
.warn{background:var(--warn);border:1px solid var(--warnline);border-radius:6px;padding:8px 12px;margin:8px 0}
.bad{border-color:var(--fail)}.ok{border-color:var(--pass)}
.pill{display:inline-block;border-radius:12px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff}
.s-PASS{background:var(--pass)}.s-FAIL{background:var(--fail)}.s-BLOCKED{background:var(--block)}.s-INCONCLUSIVE{background:var(--inc)}.s-NT{background:var(--nt)}
.c-PASS{color:var(--pass)}.c-FAIL{color:var(--fail)}.c-BLOCKED{color:var(--block)}.c-INCONCLUSIVE{color:var(--inc)}.c-NT{color:var(--nt)}
.stbtns{display:flex;flex-wrap:wrap;gap:6px}.stbtns button{font-weight:700}
.stbtns button.on{color:#fff;border-color:transparent}
label.chk{display:flex;gap:8px;align-items:flex-start;margin:5px 0}
label.chk input{margin-top:4px}
.fld{display:grid;grid-template-columns:minmax(180px,1fr) 2fr;gap:6px 12px;align-items:center;margin:6px 0}
@media (max-width:640px){.fld{grid-template-columns:1fr}}
input[type=text],select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:5px 8px}
textarea{min-height:90px;resize:vertical}
.hint{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-width:860px;width:100%}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top;font-size:14px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.toast{position:fixed;right:16px;bottom:16px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:30}
ol,ul{padding-left:22px;margin:6px 0}li{margin:3px 0}
</style>
</head>

<div id="app"><noscript><p style="padding:20px">This testing guide needs JavaScript (it is fully offline: no network requests are made).</p></noscript></div>

<script>
'use strict';
/* RevitExtractor v1 live-test guide. Standalone, offline. No network calls, no external assets.
   All text from users or imported files is inserted with textContent only (never as HTML). */

var GUIDE = { schema: 'rx-v1-live-test', schemaVersion: 1, version: '1.1.0', date: '2026-11-16',
  baseline: 'branch mgo-changes; the exact commit is the Expected baseline set on the Start page' };
var STATUSES = ['NOT TESTED', 'PASS', 'FAIL', 'BLOCKED', 'INCONCLUSIVE'];
var GLYPH = { 'NOT TESTED': '\u00b7', 'PASS': '\u2713', 'FAIL': '\u2717', 'BLOCKED': '\u2298', 'INCONCLUSIVE': '?' };
var SCLASS = { 'NOT TESTED': 'NT', 'PASS': 'PASS', 'FAIL': 'FAIL', 'BLOCKED': 'BLOCKED', 'INCONCLUSIVE': 'INCONCLUSIVE' };

/* ---------- PowerShell building blocks (copied from the verified specs/v1-revit-test.md blocks) ---------- */
var P = {};
P.repo = String.raw`$repo = $env:RX_REPO   # set once, see test P1
if (-not $repo -or -not (Test-Path $repo)) { throw 'Set RX_REPO first: see test P1.' }
Set-Location $repo`;
P.kit = P.repo + '\n' + String.raw`$kit = Join-Path $repo 'pyRevit\Extractor.extension\RVTExtractor.tab\Setup.panel\tests\v1_test_kit.ps1'
if (-not (Test-Path $kit)) { throw 'Wrong $repo: v1_test_kit.ps1 not found. Set $repo to the folder that holds pyRevit and specs.' }`;
P.tests = P.repo + '\n' + String.raw`$tests = Join-Path $repo 'pyRevit\Extractor.extension\RVTExtractor.tab\Setup.panel\tests'`;
P.out = String.raw`$ini = Join-Path $env:APPDATA 'pyRevit\pyRevit_config.ini'   # the output folder the Export window uses
$out = $null; $inSec = $false
if (Test-Path $ini) { foreach ($l in Get-Content $ini) { if ($l -match '^\[') { $inSec = ($l.Trim() -eq '[RevitExtractorExport]') } elseif ($inSec -and $l -match '^output_parent\s*=\s*(.+)$') { $out = $Matches[1].Trim().Trim('"') } } }
if (-not $out) { $out = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'RevitExtractor' }
"Output folder exists: $(Test-Path $out)"   # must print True (the path itself is not printed on purpose)`;
P.res = String.raw`$res = 'C:\RX-test\results'; New-Item -ItemType Directory -Force $res | Out-Null   # result files stay on this computer`;
P.check = function (name) { return P.kit + '\n' + P.out + '\n' + P.res + '\n' + "& $kit -Check $out *>&1 | Tee-Object (Join-Path $res '" + name + ".txt')"; };
P.counts = function (name) { return String.raw`$t = Get-Content (Join-Path 'C:\RX-test\results' '` + name + String.raw`.txt')
"PASS lines: " + @($t | Where-Object { $_ -match '^PASS ' }).Count
"FAIL lines: " + @($t | Where-Object { $_ -match '^FAIL' }).Count
"SKIP lines: " + @($t | Where-Object { $_ -match '^SKIP ' }).Count`; };

/* ---------- field types: every structured field is pattern-restricted, so it cannot hold free text ---------- */
var FT = {
  int:    { re: /^-?\d{0,9}$/, hint: 'whole number' },
  code:   { re: /^[A-Za-z0-9._-]{0,40}$/, hint: 'letters, digits . _ - only (max 40)' },
  ver:    { re: /^[0-9][0-9.]{0,19}$|^$/, hint: 'version number such as 2025.3.0.12' },
  hex:    { re: /^[0-9a-fA-F]{0,40}$/, hint: 'hex commit id' },
  choice: { re: null, hint: '' }
};
var F_ERR = { k: 'err', l: 'Sanitized error category (code, optional)', t: 'code', h: 'e.g. ImportError, none. Never paste a message.' };
var YN = ['yes', 'no'];
var RUNSTATE = ['OK', 'FAIL', 'INCOMPLETE', 'NOT STARTED', 'no such run'];
var SPOOL = ['Automatic', 'Manual', 'Disabled', 'other'];
var GENERIC_EVIDENCE = 'Status, the ticked checks and the structured values above. Nothing else is needed. Leave the notes empty unless a short, generic remark changes how the result must be read.';

/* ---------- the tests ---------- */
var PARTS = [
  { id: 'P', name: 'Prepare (Revit closed)' },
  { id: 'G', name: 'Scripts (Revit closed)' },
  { id: 'A', name: 'A. First click' },
  { id: 'B', name: 'B. Model window' },
  { id: 'C', name: 'C. Exports with sample models' },
  { id: 'D', name: 'D. Scale and edge cases' },
  { id: 'E', name: 'E. Polish' },
  { id: 'F', name: 'F. Revit 2025 machine' },
  { id: 'H', name: 'H. Cloud (ACC) models' }
];
var SYN = 'Uses only the Autodesk sample models copied by the kit. No client model is needed.';
var CLOUDRULE = 'Needs a real ACC model, so this is an exception to the synthetic-data rule (like D4) and needs your explicit authorization. Only counts and choices leave the computer, never a model, project or file name, a path or a GUID.';
var TESTS = [
{ id: 'P1', part: 'P', title: 'Baseline, tools and pyRevit registration', where: 'PowerShell (Windows PowerShell 5.1) on Computer B, then Revit',
  purpose: 'Make sure Computer B runs exactly the code version you intend to test, and that the tools the later tests need are present.',
  prereq: ['A copy of the RevitExtractor repository on Computer B (clone, or an unzipped archive of one commit). It is public code and holds no client data.', 'Windows PowerShell 5.1 (the blue "Windows PowerShell", not PowerShell 7).'],
  steps: ['Open Windows PowerShell. The starting directory does not matter.', 'Run block 1. A folder picker opens: select the folder that **contains `pyRevit` and `specs`**. The block prints only True or False.',
    'Run block 2 to move the clone to the expected baseline. If you have no git on this computer, skip it, unzip the archive made on Computer A instead, and enter the commit id from the archive name below.',
    'Run block 3 and note the versions. Python 3 is needed for the G and F1 tests; Node 24+ is optional (C3, C14).',
    'In Revit: pyRevit settings, Custom Extension Directories, add `<clone>\\pyRevit` (once per machine; skip if already present). Then **Reload pyRevit**.'],
  cmds: function () { var sha = S.session.expectedBaseline;
    return [
    { t: '1. Tell the later blocks where the clone is (folder picker, once per machine)', cwd: 'any', c: String.raw`Add-Type -AssemblyName System.Windows.Forms
$d = New-Object System.Windows.Forms.FolderBrowserDialog
$d.Description = 'Select the folder that contains pyRevit and specs (the RevitExtractor clone)'
if ($d.ShowDialog() -eq 'OK') {
  [Environment]::SetEnvironmentVariable('RX_REPO', $d.SelectedPath, 'User')
  $env:RX_REPO = $d.SelectedPath
}
Test-Path (Join-Path $env:RX_REPO 'pyRevit\Extractor.extension')   # must print True` },
    { t: '2. Move the clone to the expected baseline' + (sha ? ' (' + sha + ')' : ' (NO baseline set on the Start page: this uses the branch tip)'), cwd: 'any (the block changes into the clone)',
      c: P.repo + '\ngit fetch origin\n' + (sha ? 'git reset --keep ' + sha : 'git reset --keep origin/mgo-changes   # set the expected baseline on the Start page to pin a commit') + '\ngit rev-parse --short HEAD   # record this value below' },
    { t: '3. Tool versions', cwd: 'any', c: "$PSVersionTable.PSVersion.ToString()   # expect 5.1.x\npython --version\nnode --version   # optional; v24 or higher" }]; },
  expect: ['Block 1 printed True.', 'Block 2 printed a short commit id equal to the expected baseline (the page below compares it for you).', 'Block 3: PowerShell version starts with 5.1, and python printed a 3.x version.'],
  fields: [{ k: 'hash', l: 'Commit id printed by block 2 (hex)', t: 'hex' }, { k: 'py', l: 'Python version', t: 'ver' }, { k: 'node', l: 'Node major version (blank if none)', t: 'int' }],
  extra: 'baseline',
  evidence: 'The commit id and the version numbers. Nothing else.',
  trouble: ['Block 1 printed False: you selected the wrong folder. Run it again and choose the folder that contains both `pyRevit` and `specs`.', '`git reset --keep` refuses: you edited tracked files. Do not use `--hard`; ask for help or move the edits away first.', 'No git, or no access to the fork: use the zip made on Computer A (see Start page, workflow) and set `RX_REPO` through block 1 on the unzipped folder.', 'Never run `git pull` on the Revit computer (project rule).'] },

{ id: 'P2', part: 'P', title: 'Build the synthetic sample folder', where: 'PowerShell on Computer B',
  purpose: 'Create `C:\\RX-test`, a folder of copies of Autodesk sample models plus edge-case names (spaces, Polish letters, `&`, `%`, backup files, a fake model). It makes every later test possible without any client model.',
  prereq: ['P1 passed.', 'Autodesk sample models under `C:\\ProgramData\\Autodesk\\RVT <year>\\` (installed with Revit), about 100 MB free disk.', SYN],
  steps: ['Run the block. The kit only **copies** files; it never opens or changes the source models.', 'Look at the listing printed by the second command.', 'Optional, for B6 and D6: add `-Newer` / `-Older` models. Easiest synthetic source: on a Revit 2025 machine a sample from the 2025 folder is "newer" for a 2022 machine; a 2022 sample is "older" for the 2025 machine. Build again with `-Force` (removes only a folder this kit made).'],
  cmds: function () { return [
    { t: 'Build C:\\RX-test', cwd: 'any', c: P.kit + '\n& $kit -Setup' },
    { t: 'List what was created (names only)', cwd: 'any', c: "Get-ChildItem 'C:\\RX-test' | Select-Object Name, Length" },
    { t: 'Optional: rebuild with a newer and an older model (two file pickers; -Force deletes C:\\RX-test including results, so skip it if you already have results there)', cwd: 'any',
      c: P.kit + String.raw`
Add-Type -AssemblyName System.Windows.Forms
function Pick($title) { $d = New-Object System.Windows.Forms.OpenFileDialog; $d.Title = $title; $d.Filter = 'Revit models (*.rvt)|*.rvt'; if ($d.ShowDialog() -eq 'OK') { $d.FileName } }
$new = Pick 'Select a model saved in a NEWER Revit than the one you test with'
$old = Pick 'Select a model saved in an OLDER Revit than the one you test with'
if (-not $new -or -not $old) { throw 'Both models are needed. Otherwise mark B6 and D6 BLOCKED.' }

  expect: ['The kit finished without an error.', 'C:\\RX-test holds the folders Samples, Backup, a folder with spaces, a folder with Polish letters, `Tower.2024.rvt` and `Not a model.rvt`.'],

  evidence: 'Whether the two samples were found. Not the folder listing.',
  trouble: ['"No sample models found": pass `-SampleA` and `-SampleB` with two small **non-confidential** .rvt files. A synthetic option: in Revit create a new empty project from a template, save it twice under different names.', 'Folder already exists: add `-Force` (only works for a folder this kit made).', 'Script refused as "not digitally signed": run `Get-ChildItem -Recurse "$env:RX_REPO\\pyRevit" -Filter *.ps1 | Unblock-File` once. Do not change the execution policy.'] },

{ id: 'P3', part: 'P', title: 'The "before" machine check (S1)', where: 'PowerShell on Computer B',

  cmds: function () { return [

/* ---------- state ---------- */
var ORDER = TESTS.map(function (t) { return t.id; });
var BYID = {}; TESTS.forEach(function (t) { BYID[t.id] = t; });
var SESSION_FIELDS = {
  role: { l: 'This computer', t: 'choice', o: ['Revit 2022 machine', 'Revit 2025 machine', 'other Revit machine'] },
  revitYear: { l: 'Revit year in use', t: 'int' },
  extractorBuild: { l: 'Extractor build', t: 'ver' },
  pyrevit: { l: 'pyRevit version', t: 'ver' },
  expectedBaseline: { l: 'Expected baseline commit (set on Computer A)', t: 'hex' }
};
var KEY = 'rx-v1-live-test/state/v1';
var S, storageOK = false, loadInfo = '';
function freshState() { return { schema: GUIDE.schema, schemaVersion: GUIDE.schemaVersion, guideVersion: GUIDE.version, session: { role: '', revitYear: '', extractorBuild: '', pyrevit: '', expectedBaseline: '' }, current: 'home', tests: {}, updatedAt: null }; }
function T(id) { if (!S.tests[id]) S.tests[id] = { status: 'NOT TESTED', checks: {}, fields: {}, note: '', noteApproved: false, updatedAt: null, completedAt: null }; return S.tests[id]; }
function statusOf(id) { return S.tests[id] ? S.tests[id].status : 'NOT TESTED'; }
function allFields(t) { return (t.fields || []).concat([F_ERR]); }
function checksOf(t) { return ['ran'].concat((t.expect || []).map(function (_, i) { return 'e' + i; })); }
function fieldOk(def, v) {
  if (typeof v !== 'string') return false;
  if (def.t === 'choice') return v === '' || (def.o || []).indexOf(v) >= 0;
  return FT[def.t].re.test(v) && v.length <= 40;
}

/* sanitize any object (import, embedded, localStorage) into a valid state; unknown keys are dropped */
function sanitizeState(o) {
  var warns = [];
  if (!o || typeof o !== 'object' || Array.isArray(o)) return { error: 'Not a test-state object.' };
  if (o.schema !== GUIDE.schema) return { error: 'Wrong schema (expected ' + GUIDE.schema + ').' };
  if (o.schemaVersion !== GUIDE.schemaVersion) return { error: 'Unsupported schema version.' };

  upd(); box.append(ta, flag, h('label', { class: 'chk' }, ap, h('span', {}, 'I read this note and approve it for export.')));
  m.append(box);

  sec('Evidence Claude requires', h('p', {}, rich(t.evidence || GENERIC_EVIDENCE)));
  if (t.trouble && t.trouble.length) { var dt = h('details', {}, h('summary', {}, 'Troubleshooting')); dt.append(ul(t.trouble)); m.append(h('div', { class: 'card' }, dt)); }

  var hintEl = h('div', { class: 'hint', id: 'sthint' }), btns = h('div', { class: 'stbtns', role: 'group', 'aria-label': 'Result' });

  m.append(btns, hintEl); updHint(t);
  m.append(h('div', { class: 'row', style: 'margin-top:18px' },
    h('button', { disabled: idx === 0, onclick: function () { go(ORDER[idx - 1]); } }, '\u2190 Previous'),
    h('button', { class: 'primary', disabled: idx === ORDER.length - 1, onclick: function () { go(ORDER[idx + 1]); } }, 'Continue \u2192 ' + (ORDER[idx + 1] || '')),
    h('button', { onclick: function () { var n = summary().next; if (n) go(n); } }, 'Next untested'), h('button', { onclick: function () { go('dash'); } }, 'Dashboard')));

  function chk(k, label) { var c = h('input', { type: 'checkbox' }); c.checked = d.checks[k] === true; c.addEventListener('change', function () { if (c.checked) d.checks[k] = true; else delete d.checks[k]; touch(d); persist(); updHint(t); refreshChrome(); }); return [c, h('span', {}, k === 'ran' ? label : rich(label))]; }
}
function ul(a) { var e = h('ul'); a.forEach(function (x) { e.append(h('li', {}, rich(x))); }); return e; }
function ol(a) { var e = h('ol'); a.forEach(function (x) { e.append(h('li', {}, rich(x))); }); return e; }
function touch(d) { d.updatedAt = new Date().toISOString(); }
function setStatus(t, s) {

}
function updHint(t) {

function refreshChrome() { var old = document.querySelector('header'); if (old) old.replaceWith(headerEl()); }

/* ---------- modals ---------- */
function modal(content) { var wrap = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'box' }, content)); document.body.append(wrap); return function close() { wrap.remove(); }; }
function openReview(kind) {
  var inc = {}, body = h('div'), close, lines = [];
  var list = h('div'); var chosen = {};
  var sm = summary();
  body.append(h('h2', {}, kind === 'html' ? 'Review before saving the filled HTML' : kind === 'json' ? 'Review before exporting results' : 'Review before copying the summary'),
    h('div', { class: 'warn' }, 'Only what is listed here is included. Nothing is uploaded; the file stays where you save it. Read every line.'));
  var tests = ORDER.filter(function (id) { var d = S.tests[id]; return d && (d.status !== 'NOT TESTED' || Object.keys(d.checks).length || Object.keys(d.fields).length || d.note); });
  body.append(h('p', {}, tests.length + ' of ' + sm.total + ' tests have data. Status: ' + STATUSES.map(function (s) { return sm.counts[s].length + ' ' + s; }).join(', ') + '.'));
  var sess = Object.keys(S.session).filter(function (k) { return S.session[k]; }).map(function (k) { return k + '=' + S.session[k]; }).join(', ');
  body.append(h('p', {}, 'Session values: ' + (sess || 'none')));
  var tbl = h('table', {}, h('tr', {}, h('th', {}, 'Test'), h('th', {}, 'Typed values included')));
  tests.forEach(function (id) { var d = S.tests[id], f = Object.keys(d.fields).filter(function (k) { return d.fields[k] !== ''; }).map(function (k) { return k + '=' + d.fields[k]; }).join('; '); tbl.append(h('tr', {}, h('td', {}, id + ' ' + d.status), h('td', {}, f || '\u2014'))); });
  body.append(tbl);
  var withNotes = tests.filter(function (id) { return S.tests[id].note; });
  body.append(h('h3', { class: 'sec' }, 'Notes (' + withNotes.length + ')'));
  if (!withNotes.length) body.append(h('p', { class: 'hint' }, 'No notes exist.'));
  withNotes.forEach(function (id) {
    var d = S.tests[id], hits = scanNote(d.note), row = h('div', { class: 'card' });
    row.append(h('strong', {}, id));
    if (!d.noteApproved) { row.append(h('p', { class: 'hint' }, 'Not approved on the test page (' + d.note.length + ' characters): EXCLUDED. It stays in this browser only.')); }
    else {
      var cb = h('input', { type: 'checkbox' }); cb.checked = hits.length === 0; chosen[id] = cb.checked;
      cb.addEventListener('change', function () { chosen[id] = cb.checked; });
      row.append(h('pre', {}, d.note));
      if (hits.length) row.append(h('div', { class: 'warn bad' }, 'Possible private content: ' + hits.join(', ') + '. Excluded unless you tick the box.'));
      row.append(h('label', { class: 'chk' }, cb, h('span', {}, hits.length ? 'Include this note despite the warning' : 'Include this note (no known pattern matched; that is not proof)')));
    }
    body.append(row);
  });
  if (kind === 'html') body.append(h('div', { class: 'warn' }, 'Notes that are excluded will NOT be stored in the saved file. They remain only in this browser. To keep a note in the file, approve and include it.'));
  var conf = h('input', { type: 'checkbox' }), go1 = h('button', { class: 'primary', disabled: true }, kind === 'summary' ? 'Copy to clipboard' : 'Download');
  conf.addEventListener('change', function () { go1.disabled = !conf.checked; });
  go1.addEventListener('click', function () {
    var o = buildExport(chosen);
    if (kind === 'json') download('rx-v1-test-results-' + stamp() + '.json', JSON.stringify(o, null, 2), 'application/json');
    else if (kind === 'html') saveHtml(o);
    else copyText(markdownSummary(o));
    close();
  });
  body.append(h('label', { class: 'chk' }, conf, h('span', {}, 'I have read everything listed above. It contains no client names, project names, model or file names, paths, GUIDs, user names or screenshots.')),
    h('div', { class: 'row' }, go1, h('button', { onclick: function () { close(); } }, 'Cancel')));
  close = modal(body);
}
function safeJson(o) { return JSON.stringify(o).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029'); }
function saveHtml(o) {
  var clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').textContent = '';

  Array.prototype.slice.call(clone.querySelector('body').children).forEach(function (n) {
    var keep = n.id === 'app' || n.id === 'rx-embedded' || (n.tagName === 'SCRIPT' && !n.id);
    if (!keep) n.remove();
  });
  clone.querySelector('#rx-embedded').textContent = safeJson(o);

}
function importPick() { document.getElementById('imp').click(); }
function importFile(ev) {

  r.onload = function () {
    var res; try { res = sanitizeState(JSON.parse(String(r.result))); } catch (e) { res = { error: 'Not valid JSON.' }; }
    var body = h('div'), close;
    if (res.error) { body.append(h('h2', {}, 'Import refused'), h('p', {}, res.error), h('button', { onclick: function () { close(); } }, 'Close')); close = modal(body); return; }
    var n = Object.keys(res.state.tests).length;
    body.append(h('h2', {}, 'Import results?'), h('p', {}, 'The file holds ' + n + ' test record(s). Importing REPLACES your current progress in this browser.'),
      res.warns.length ? h('div', { class: 'warn' }, 'Ignored or dropped: ' + res.warns.slice(0, 8).join('; ') + (res.warns.length > 8 ? ' (+' + (res.warns.length - 8) + ' more)' : '')) : null,
      h('div', { class: 'row' }, h('button', { class: 'danger', onclick: function () { S = res.state; S._alt = null; persist(); close(); render(); toast('Imported'); } }, 'Overwrite and import'), h('button', { onclick: function () { close(); } }, 'Cancel')));
    close = modal(body);
